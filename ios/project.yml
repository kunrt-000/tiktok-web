name: TikTokWeb
options:
  bundleIdPrefix: com.tiktok.webview
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
targets:
  TikTokWeb:
    type: application
    platform: iOS
    sources:
      - path: TikTokWeb
        excludes:
          - "Info.plist"
    info:
      path: TikTokWeb/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiktok.webview.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  TikTokWeb:
    build:
      targets:
        TikTokWeb: all
    run:
      config: Release
    archive:
      config: Release
