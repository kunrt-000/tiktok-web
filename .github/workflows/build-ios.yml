name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 查看可用 SDK 与模拟器
        run: xcodebuild -showsdks

      - name: 构建（未签名）
        working-directory: ios
        run: |
          xcodebuild -project TikTokWeb.xcodeproj \
            -scheme TikTokWeb \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build

      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/TikTokWeb.app Payload/
          zip -qr TikTokWeb-unsigned.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: TikTokWeb-unsigned-ipa
          path: TikTokWeb-unsigned.ipa
          retention-days: 30
